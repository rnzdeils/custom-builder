name: Build Herdr Renamer (Linux)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag o branch del plugin a compilar"
        required: false
        default: "fadec8f1cadcae8e0b4abdeaf84ceede2990b2e1"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 (musl)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del plugin
        uses: actions/checkout@v4
        with:
          repository: wyattjoh/herdr-plugin-renamer
          ref: ${{ inputs.ref }}
          path: plugin
          persist-credentials: false

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Instalar linker musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Compilar binario estático
        working-directory: plugin
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: x86_64-linux-musl-gcc
        run: |
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Empaquetar plugin
        shell: bash
        run: |
          package_dir="dist/herdr-plugin-renamer"

          mkdir -p "$package_dir/target/release"
          cp plugin/herdr-plugin.toml "$package_dir/"
          cp plugin/target/x86_64-unknown-linux-musl/release/herdr-plugin-renamer \
            "$package_dir/target/release/"

          chmod 755 "$package_dir/target/release/herdr-plugin-renamer"

          tar -C dist -czf \
            "$GITHUB_WORKSPACE/herdr-plugin-renamer-linux-x86_64.tar.gz" \
            herdr-plugin-renamer

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: herdr-plugin-renamer-linux-x86_64
          path: herdr-plugin-renamer-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 4
